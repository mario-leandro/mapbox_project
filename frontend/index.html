<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Freightly</title>

    <!-- Applies the saved/system theme before first paint (avoids a light flash in dark mode). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Absolute paths on purpose: nested routes like /historico/12 must still find these files. -->
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/layouts.css" />
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <div id="app">
      <div class="initial-loader" role="status"><span class="spinner" aria-hidden="true"></span><span class="visually-hidden">Carregando…</span></div>
    </div>

    <div id="route-announcer" class="visually-hidden" aria-live="polite"></div>

    <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
